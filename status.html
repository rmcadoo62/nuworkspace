<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Status | NU Labs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="js/nulabs-session-storage.js"></script>
<style>
:root{
  --bg:#ffffff;--surface:#ffffff;--surface2:#f0f0f3;--surface3:#e8e8ed;
  --border:#dcdce0;--text:#1a1a2e;--muted:#6b6b78;
  --amber:#c07a1a;--amber-dim:#9a6214;--amber-glow:rgba(192,122,26,0.10);
  --green:#2e9e62;--green-glow:rgba(46,158,98,0.10);
  --red:#d04040;--radius:10px;
}
*{box-sizing:border-box;}
body{
  margin:0;font-family:'DM Sans',sans-serif;background:var(--surface2);color:var(--text);
  min-height:100vh;-webkit-tap-highlight-color:transparent;
}
.wrap{max-width:480px;margin:0 auto;padding:20px 16px 40px;}
.header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px;}
.header h1{font-family:'DM Serif Display',serif;font-size:22px;margin:0;color:var(--text);}
.header .sub{font-size:12px;color:var(--muted);margin-top:2px;}
.header-right{display:flex;align-items:center;gap:10px;}
.icon-btn{
  background:transparent;border:1px solid var(--border);border-radius:8px;
  width:34px;height:34px;display:flex;align-items:center;justify-content:center;
  color:var(--muted);cursor:pointer;font-size:16px;
}
.icon-btn:active{background:var(--surface3);}
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px 18px;margin-bottom:12px;cursor:pointer;transition:border-color .15s;
}
.card:active{border-color:var(--amber-dim);}
.card-label{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-bottom:10px;}
.card-row{display:flex;justify-content:space-between;align-items:flex-end;}
.card-col .k{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:2px;}
.card-col .v{font-family:'JetBrains Mono',monospace;font-weight:500;font-size:24px;color:var(--text);}
.card-col.ytd .v{font-size:15px;color:var(--muted);}
.card-col.ytd{text-align:right;}
.chart-box{height:160px;margin-top:14px;display:none;}
.chart-box.open{display:block;}
.login-screen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
}
.login-card{
  width:100%;max-width:340px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:28px 24px;
}
.login-card h1{font-family:'DM Serif Display',serif;font-size:20px;margin:0 0 18px;text-align:center;}
.login-card input{
  width:100%;padding:10px 12px;margin-bottom:10px;border:1px solid var(--border);
  border-radius:8px;font-size:14px;font-family:inherit;background:var(--surface2);color:var(--text);
}
.login-card input:focus{outline:none;border-color:var(--amber-dim);}
.login-card button{
  width:100%;padding:10px;border:none;border-radius:8px;background:var(--amber);
  color:#fff;font-weight:600;font-size:14px;cursor:pointer;margin-top:4px;
}
.login-err{color:var(--red);font-size:12.5px;margin:6px 0 0;min-height:16px;text-align:center;}
.loading{text-align:center;color:var(--muted);font-size:13px;padding:40px 0;}
.updated-at{text-align:center;font-size:11px;color:var(--muted);margin-top:6px;}
</style>
</head>
<body>

<div id="loginScreen" class="login-screen" style="display:none;">
  <div class="login-card">
    <h1>NU Labs Status</h1>
    <input id="loginEmail" type="email" placeholder="Email" autocomplete="username">
    <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password">
    <button id="loginBtn" onclick="doLogin()">Sign in</button>
    <p class="login-err" id="loginError"></p>
  </div>
</div>

<div id="app" style="display:none;">
  <div class="wrap">
    <div class="header">
      <div>
        <h1>Status</h1>
        <div class="sub" id="monthLabel"></div>
      </div>
      <div class="header-right">
        <button class="icon-btn" onclick="loadAllMetrics()" title="Refresh">&#8635;</button>
      </div>
    </div>

    <div id="cards"><div class="loading">Loading…</div></div>
    <div class="updated-at" id="updatedAt"></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://swuuxzmgmldvvomsgmjf.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN3dXV4em1nbWxkdnZvbXNnbWpmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI4MjcyMzMsImV4cCI6MjA4ODQwMzIzM30.GinbXqvBHcvYRaACBhgpd_Si8-qIDDj7PlbTCINcSU8';

let sb = null;
const charts = {};

const now = new Date();
const curYear = now.getFullYear();
const curMonthIdx = now.getMonth(); // 0-based
const yearStart = curYear + '-01-01';
const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function monthKey(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }
function fmt$(n){ return '$' + Math.round(n).toLocaleString('en-US'); }

// ---- paginated fetch helper ----
async function fetchAll(table, columns, filters){
  let rows = [], page = 0;
  while(true){
    let q = sb.from(table).select(columns).range(page*1000, page*1000+999);
    if (filters) q = filters(q);
    const { data, error } = await q;
    if (error) { console.error(table, error); break; }
    if (!data || data.length === 0) break;
    rows = rows.concat(data);
    if (data.length < 1000) break;
    page++;
  }
  return rows;
}

// ---- BOOKINGS: net task fixed_price by month, created minus real cancellations ----
// tasks.cancelled_date is unreliable — thousands of closed-project tasks carry
// a bulk-migration cancelled_date that has nothing to do with a real 2026
// reversal. The activity_log has the actual cancellation EVENT (status ->
// 'cancelled'), which is what a real reversal looks like. We dedupe to the
// first such event per task (a task cancelled more than once should only
// count once) and attribute it to the month the event itself happened in.
async function computeBookingsByMonth(){
  const [positive, cancelEvents] = await Promise.all([
    fetchAll('tasks', 'fixed_price,created_at,status', q => q.gte('created_at', yearStart).neq('status','cancelled')),
    fetchAll('activity_log', 'record_id,created_at', q => q
      .eq('record_type','tasks').eq('field_changed','status').eq('new_value','cancelled')
      .gte('created_at', yearStart))
  ]);

  const byMonth = {};
  positive.forEach(r => {
    const k = (r.created_at||'').slice(0,7);
    if (!k) return;
    byMonth[k] = (byMonth[k]||0) + (parseFloat(r.fixed_price)||0);
  });

  // Dedupe cancellation events to the earliest one per task.
  const firstCancelByTask = {};
  cancelEvents.forEach(e => {
    if (!e.record_id) return;
    if (!firstCancelByTask[e.record_id] || e.created_at < firstCancelByTask[e.record_id]) {
      firstCancelByTask[e.record_id] = e.created_at;
    }
  });
  const taskIds = Object.keys(firstCancelByTask);
  if (taskIds.length) {
    const cancelledTasks = await fetchAll('tasks', 'id,fixed_price', q => q.in('id', taskIds));
    const priceById = {};
    cancelledTasks.forEach(t => { priceById[t.id] = parseFloat(t.fixed_price)||0; });
    Object.entries(firstCancelByTask).forEach(([taskId, when]) => {
      const k = when.slice(0,7);
      byMonth[k] = (byMonth[k]||0) - (priceById[taskId]||0);
    });
  }

  return byMonth;
}

// ---- SALES: billed revenue by billed_date month ----
async function computeSalesByMonth(){
  const rows = await fetchAll('tasks', 'fixed_price,billed_date', q => q.eq('status','billed').gte('billed_date', yearStart));
  const byMonth = {};
  rows.forEach(r => {
    const k = (r.billed_date||'').slice(0,7);
    if (!k) return;
    byMonth[k] = (byMonth[k]||0) + (parseFloat(r.fixed_price)||0);
  });
  return byMonth;
}

// ---- QUOTES: true delta accounting ----
// Each quote row (a revision of some base opportunity) only contributes the
// CHANGE in total versus that opportunity's immediately-prior revision, not
// its full face value. A brand-new opportunity's first revision counts in
// full; a later revision counts only the incremental $ added or removed
// versus what was already counted for that opportunity. Attributed to the
// month the revision itself was created in.
async function computeQuotesByMonth(){
  const rows = await fetchAll('quotes', 'opportunity,total,created_at,id');
  const withBase = rows
    .filter(r => r.opportunity && r.created_at && r.total !== null)
    .map(r => ({
      base: r.opportunity.replace(/[A-Za-z]+$/, ''),
      total: parseFloat(r.total)||0,
      created_at: r.created_at,
      id: r.id,
      month: r.created_at.slice(0,7)
    }));

  // Sort within each base_opp group by created_at (tie-break by id) so we can
  // walk revisions in true chronological order.
  const groups = {};
  withBase.forEach(r => {
    groups[r.base] = groups[r.base] || [];
    groups[r.base].push(r);
  });

  const byMonth = {};
  Object.values(groups).forEach(group => {
    group.sort((a,b) => a.created_at < b.created_at ? -1 : a.created_at > b.created_at ? 1 : a.id - b.id);
    let prevTotal = 0;
    group.forEach(r => {
      const delta = r.total - prevTotal;
      byMonth[r.month] = (byMonth[r.month]||0) + delta;
      prevTotal = r.total;
    });
  });
  return byMonth;
}

function last12Keys(){
  const keys = [];
  for (let i = 11; i >= 0; i--) {
    const d = new Date(curYear, curMonthIdx - i, 1);
    keys.push(monthKey(d));
  }
  return keys;
}

function ytdSum(byMonth){
  let sum = 0;
  for (let m = 0; m <= curMonthIdx; m++) {
    const k = monthKey(new Date(curYear, m, 1));
    sum += byMonth[k] || 0;
  }
  return sum;
}

const METRICS = [
  { key:'quotes',   label:'Quotes',   icon:'&#128196;', fn: computeQuotesByMonth },
  { key:'bookings', label:'Bookings', icon:'&#128188;', fn: computeBookingsByMonth },
  { key:'sales',    label:'Sales',    icon:'&#128176;', fn: computeSalesByMonth },
];

async function loadAllMetrics(){
  document.getElementById('monthLabel').textContent = MONTH_NAMES[curMonthIdx] + ' ' + curYear;
  const cardsEl = document.getElementById('cards');
  cardsEl.innerHTML = '<div class="loading">Loading…</div>';
  try {
    const results = await Promise.all(METRICS.map(m => m.fn()));
    cardsEl.innerHTML = '';
    METRICS.forEach((m, i) => {
      const byMonth = results[i];
      const thisMonthKey = monthKey(now);
      const thisMonth = byMonth[thisMonthKey] || 0;
      const ytd = ytdSum(byMonth);
      cardsEl.appendChild(buildCard(m, thisMonth, ytd, byMonth));
    });
    document.getElementById('updatedAt').textContent = 'Updated ' + now.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  } catch (e) {
    console.error(e);
    cardsEl.innerHTML = '<div class="loading">Failed to load — pull to refresh</div>';
  }
}

function buildCard(metric, thisMonth, ytd, byMonth){
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML =
    '<div class="card-label">' + metric.icon + ' ' + metric.label + '</div>' +
    '<div class="card-row">' +
      '<div class="card-col"><div class="k">This month</div><div class="v">' + fmt$(thisMonth) + '</div></div>' +
      '<div class="card-col ytd"><div class="k">Year to date</div><div class="v">' + fmt$(ytd) + '</div></div>' +
    '</div>' +
    '<div class="chart-box" id="chart-' + metric.key + '"><canvas id="canvas-' + metric.key + '"></canvas></div>';
  card.addEventListener('click', () => toggleChart(metric.key, byMonth));
  return card;
}

function toggleChart(key, byMonth){
  const box = document.getElementById('chart-' + key);
  const isOpen = box.classList.contains('open');
  document.querySelectorAll('.chart-box.open').forEach(b => b.classList.remove('open'));
  if (isOpen) return;
  box.classList.add('open');
  if (charts[key]) { charts[key].destroy(); }
  const keys = last12Keys();
  const labels = keys.map(k => MONTH_NAMES[parseInt(k.slice(5,7),10)-1]);
  const data = keys.map(k => Math.round(byMonth[k] || 0));
  const ctx = document.getElementById('canvas-' + key).getContext('2d');
  charts[key] = new Chart(ctx, {
    type:'bar',
    data:{ labels, datasets:[{ data, backgroundColor:'#c07a1a', borderRadius:3 }] },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label: c => fmt$(c.parsed.y) } } },
      scales:{
        x:{ ticks:{ color:'#6b6b78', font:{size:10} }, grid:{ display:false } },
        y:{ ticks:{ color:'#6b6b78', font:{size:10}, callback: v => (v>=1000?('$'+(v/1000)+'k'):('$'+v)) }, grid:{ color:'#e8e8ed' } }
      }
    }
  });
}

// ---- AUTH ----
async function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPassword').value;
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('loginError');
  err.textContent = '';
  if (!email || !pass) { err.textContent = 'Enter email and password'; return; }
  btn.disabled = true; btn.textContent = 'Signing in…';
  const { error } = await sb.auth.signInWithPassword({ email, password: pass });
  btn.disabled = false; btn.textContent = 'Sign in';
  if (error) { err.textContent = 'Invalid email or password'; return; }
  showApp();
}

function showApp(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  loadAllMetrics();
}

function showLogin(){
  document.getElementById('app').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
}

(async function start(){
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: {
      storage: window.nulabsSessionStorage || window.localStorage,
      autoRefreshToken: true,
      persistSession: true,
      detectSessionInUrl: false
    }
  });

  sb.auth.onAuthStateChange((event) => {
    if (event === 'SIGNED_OUT') showLogin();
  });

  let { data: { session } } = await sb.auth.getSession();
  if (session && session.expires_at) {
    const msLeft = (session.expires_at * 1000) - Date.now();
    if (msLeft < 60000) {
      const { data: refreshed, error } = await sb.auth.refreshSession();
      if (error) { showLogin(); return; }
      session = refreshed.session;
    }
  }

  if (session && session.user) {
    showApp();
  } else {
    showLogin();
  }
})();
</script>
</body>
</html>
