<style>
:root{
  --bg:#ffffff;--surface:#ffffff;--surface2:#f0f0f3;--surface3:#e8e8ed;
  --border:#dcdce0;--text:#1a1a2e;--muted:#6b6b78;
  --amber:#c07a1a;--amber-dim:#9a6214;--amber-glow:rgba(192,122,26,0.10);
  --green:#2e9e62;--green-glow:rgba(46,158,98,0.10);
  --red:#d04040;--radius:10px;
}
*{box-sizing:border-box;}
body{
  margin:0;font-family:'DM Sans',sans-serif;background:var(--surface2);color:var(--text);
  min-height:100vh;-webkit-tap-highlight-color:transparent;
}
.wrap{max-width:480px;margin:0 auto;padding:20px 16px 40px;}
.header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px;}
.header h1{font-family:'DM Serif Display',serif;font-size:22px;margin:0;color:var(--text);}
.header .sub{font-size:12px;color:var(--muted);margin-top:2px;}
.header-right{display:flex;align-items:center;gap:10px;}
.icon-btn{
  background:transparent;border:1px solid var(--border);border-radius:8px;
  width:34px;height:34px;display:flex;align-items:center;justify-content:center;
  color:var(--muted);cursor:pointer;font-size:16px;
}
.icon-btn:active{background:var(--surface3);}
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px 18px;margin-bottom:12px;cursor:pointer;transition:border-color .15s;
}
.card:active{border-color:var(--amber-dim);}
.card-label{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-bottom:10px;}
.card-row{display:flex;justify-content:space-between;align-items:flex-end;}
.card-col .k{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:2px;}
.card-col .v{font-family:'JetBrains Mono',monospace;font-weight:500;font-size:24px;color:var(--text);}
.card-col .q{font-size:11px;color:var(--muted);margin-top:2px;}
.card-col.ytd .v{font-size:15px;color:var(--muted);}
.card-col.ytd{text-align:right;}
.chart-box{height:160px;margin-top:14px;display:none;}
.chart-box.open{display:block;}
.login-screen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
}
.login-card{
  width:100%;max-width:340px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:28px 24px;
}
.login-card h1{font-family:'DM Serif Display',serif;font-size:20px;margin:0 0 18px;text-align:center;}
.login-card input{
  width:100%;padding:10px 12px;margin-bottom:10px;border:1px solid var(--border);
  border-radius:8px;font-size:14px;font-family:inherit;background:var(--surface2);color:var(--text);
}
.login-card input:focus{outline:none;border-color:var(--amber-dim);}
.login-card button{
  width:100%;padding:10px;border:none;border-radius:8px;background:var(--amber);
  color:#fff;font-weight:600;font-size:14px;cursor:pointer;margin-top:4px;
}
.login-err{color:var(--red);font-size:12.5px;margin:6px 0 0;min-height:16px;text-align:center;}
.loading{text-align:center;color:var(--muted);font-size:13px;padding:40px 0;}
.updated-at{text-align:center;font-size:11px;color:var(--muted);margin-top:6px;}
</style>
</head>
<body>

<div id="loginScreen" class="login-screen" style="display:none;">
  <div class="login-card">
    <h1>NU Labs Status</h1>
    <input id="loginEmail" type="email" placeholder="Email" autocomplete="username">
    <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password">
    <button id="loginBtn" onclick="doLogin()">Sign in</button>
    <p class="login-err" id="loginError"></p>
  </div>
</div>

<div id="app" style="display:none;">
  <div class="wrap">
    <div class="header">
      <div>
        <h1>Status</h1>
        <div class="sub" id="monthLabel"></div>
      </div>
      <div class="header-right">
        <button class="icon-btn" onclick="loadAllMetrics()" title="Refresh">&#8635;</button>
      </div>
    </div>

    <div id="cards"><div class="loading">Loading…</div></div>
    <div class="updated-at" id="updatedAt"></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://swuuxzmgmldvvomsgmjf.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN3dXV4em1nbWxkdnZvbXNnbWpmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI4MjcyMzMsImV4cCI6MjA4ODQwMzIzM30.GinbXqvBHcvYRaACBhgpd_Si8-qIDDj7PlbTCINcSU8';

let sb = null;
const charts = {};

const now = new Date();
const curYear = now.getFullYear();
const curMonthIdx = now.getMonth(); // 0-based
const yearStart = curYear + '-01-01';
const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function monthKey(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }
function fmt$(n){ return '$' + Math.round(n).toLocaleString('en-US'); }

// ---- paginated fetch helper ----
async function fetchAll(table, columns, filters){
  let rows = [], page = 0;
  while(true){
    let q = sb.from(table).select(columns).range(page*1000, page*1000+999);
    if (filters) q = filters(q);
    const { data, error } = await q;
    if (error) {
      console.error(table, error);
      throw new Error('Query failed on ' + table + ': ' + (error.message || JSON.stringify(error)));
    }
    if (!data || data.length === 0) break;
    rows = rows.concat(data);
    if (data.length < 1000) break;
    page++;
  }
  return rows;
}

// ---- BOOKINGS: replica of dashboard.js's Booking Report, plus job counts ----
// Both bookings and reversals only ever look at CURRENT-YEAR activity, so a
// single query for tasks with created_at or cancelled_date in this year
// covers every task that matters here — open project or closed, no need to
// separately fetch full multi-year history for open projects. From that pool,
// exclude tasks on internal projects (e.g. Ballantine) and legacy-import tasks.
// Each month's entry also tracks which distinct JOBS (projects) contributed:
// "new" jobs (their very first-ever task was created this month) vs "change"
// jobs (the job already existed before this month, this is more work added
// to it). Origin dates are computed from ALL tasks ever, unfiltered, so a
// legacy-imported or since-closed job isn't mistaken for brand-new.
async function computeBookingsByMonth(){
  const [internalProjIds, yearTasks, allProjectTasks] = await Promise.all([
    fetchAll('projects', 'id', q => q.eq('is_internal', true)).then(rows => new Set(rows.map(r => r.id))),
    fetchAll('tasks', 'fixed_price,created_at,cancelled_date,status,project_id,is_legacy_import',
      q => q.or(`created_at.gte.${yearStart},cancelled_date.gte.${yearStart}`)),
    fetchAll('tasks', 'project_id,created_at')
  ]);

  const originByProject = {};
  allProjectTasks.forEach(t => {
    if (!t.project_id || !t.created_at) return;
    if (!originByProject[t.project_id] || t.created_at < originByProject[t.project_id]) {
      originByProject[t.project_id] = t.created_at;
    }
  });

  const filtered = yearTasks.filter(t => !t.is_legacy_import && !internalProjIds.has(t.project_id));

  const byMonth = {};
  const yearPrefix = yearStart.slice(0,7);
  const get = k => byMonth[k] || (byMonth[k] = { amount: 0, newJobs: new Set(), changeJobs: new Set() });

  filtered.forEach(t => {
    if (t.status !== 'cancelled') {
      const k = (t.created_at||'').slice(0,7);
      if (k >= yearPrefix) {
        const entry = get(k);
        entry.amount += (parseFloat(t.fixed_price)||0);
        if (t.project_id) {
          const originMonth = (originByProject[t.project_id]||'').slice(0,7);
          if (originMonth === k) entry.newJobs.add(t.project_id);
          else entry.changeJobs.add(t.project_id);
        }
      }
    }
    const ck = (t.cancelled_date||'').slice(0,7);
    if (ck && ck >= yearPrefix) {
      get(ck).amount -= (parseFloat(t.fixed_price)||0);
    }
  });

  return byMonth;
}

// ---- SALES: billed revenue by billed_date month, plus distinct jobs billed ----
async function computeSalesByMonth(){
  const rows = await fetchAll('tasks', 'fixed_price,billed_date,project_id', q => q.eq('status','billed').gte('billed_date', yearStart));
  const byMonth = {};
  rows.forEach(r => {
    const k = (r.billed_date||'').slice(0,7);
    if (!k) return;
    const entry = byMonth[k] || (byMonth[k] = { amount: 0, jobs: new Set() });
    entry.amount += (parseFloat(r.fixed_price)||0);
    if (r.project_id) entry.jobs.add(r.project_id);
  });
  return byMonth;
}

// ---- QUOTES: true delta accounting ----
// Each quote row (a revision of some base opportunity) only contributes the
// CHANGE in total versus that opportunity's immediately-prior revision, not
// its full face value. A brand-new opportunity's first revision counts in
// full; a later revision counts only the incremental $ added or removed
// versus what was already counted for that opportunity. Attributed to the
// month the revision itself was created in.
async function computeQuotesByMonth(){
  const rows = await fetchAll('quotes', 'opportunity,total,created_at,id');
  const withBase = rows
    .filter(r => r.opportunity && r.created_at && r.total !== null)
    .map(r => ({
      base: r.opportunity.replace(/[A-Za-z]+$/, ''),
      total: parseFloat(r.total)||0,
      created_at: r.created_at,
      id: r.id,
      month: r.created_at.slice(0,7)
    }));

  // Sort within each base_opp group by created_at (tie-break by id) so we can
  // walk revisions in true chronological order.
  const groups = {};
  withBase.forEach(r => {
    groups[r.base] = groups[r.base] || [];
    groups[r.base].push(r);
  });

  const byMonth = {};
  Object.values(groups).forEach(group => {
    group.sort((a,b) => a.created_at < b.created_at ? -1 : a.created_at > b.created_at ? 1 : a.id - b.id);
    let prevTotal = 0;
    group.forEach(r => {
      const delta = r.total - prevTotal;
      byMonth[r.month] = (byMonth[r.month]||0) + delta;
      prevTotal = r.total;
    });
  });
  return byMonth;
}

function last12Keys(){
  const keys = [];
  for (let i = 11; i >= 0; i--) {
    const d = new Date(curYear, curMonthIdx - i, 1);
    keys.push(monthKey(d));
  }
  return keys;
}

function amt(entry){ return typeof entry === 'number' ? entry : (entry ? entry.amount : 0); }

function ytdSum(byMonth){
  let sum = 0;
  for (let m = 0; m <= curMonthIdx; m++) {
    const k = monthKey(new Date(curYear, m, 1));
    sum += amt(byMonth[k]);
  }
  return sum;
}

function pluralJobs(n){ return n + (n === 1 ? ' job' : ' jobs'); }

function salesQty(byMonth){
  const monthEntry = byMonth[monthKey(now)];
  const monthCount = monthEntry ? monthEntry.jobs.size : 0;
  const ytdSet = new Set();
  for (let m = 0; m <= curMonthIdx; m++) {
    const e = byMonth[monthKey(new Date(curYear, m, 1))];
    if (e) e.jobs.forEach(id => ytdSet.add(id));
  }
  return { month: pluralJobs(monthCount), ytd: pluralJobs(ytdSet.size) };
}

function bookingsQty(byMonth){
  const monthEntry = byMonth[monthKey(now)];
  const monthNew = monthEntry ? monthEntry.newJobs.size : 0;
  const monthChange = monthEntry ? monthEntry.changeJobs.size : 0;
  const ytdNewSet = new Set(), ytdChangeSet = new Set();
  for (let m = 0; m <= curMonthIdx; m++) {
    const e = byMonth[monthKey(new Date(curYear, m, 1))];
    if (e) { e.newJobs.forEach(id => ytdNewSet.add(id)); e.changeJobs.forEach(id => ytdChangeSet.add(id)); }
  }
  return {
    month: monthNew + ' new \u00b7 ' + monthChange + ' changed',
    ytd: ytdNewSet.size + ' new \u00b7 ' + ytdChangeSet.size + ' changed'
  };
}

const METRICS = [
  { key:'quotes',   label:'Quotes',   icon:'&#128196;', fn: computeQuotesByMonth, qty: null },
  { key:'bookings', label:'Bookings', icon:'&#128188;', fn: computeBookingsByMonth, qty: bookingsQty },
  { key:'sales',    label:'Sales',    icon:'&#128176;', fn: computeSalesByMonth, qty: salesQty },
];

async function loadAllMetrics(){
  document.getElementById('monthLabel').textContent = MONTH_NAMES[curMonthIdx] + ' ' + curYear;
  const cardsEl = document.getElementById('cards');
  cardsEl.innerHTML = '<div class="loading">Loading…</div>';
  try {
    const results = await Promise.all(METRICS.map(m => m.fn()));
    cardsEl.innerHTML = '';
    METRICS.forEach((m, i) => {
      const byMonth = results[i];
      const thisMonthKey = monthKey(now);
      const thisMonth = amt(byMonth[thisMonthKey]);
      const ytd = ytdSum(byMonth);
      const qty = m.qty ? m.qty(byMonth) : null;
      cardsEl.appendChild(buildCard(m, thisMonth, ytd, byMonth, qty));
    });
    document.getElementById('updatedAt').textContent = 'Updated ' + now.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  } catch (e) {
    console.error(e);
    cardsEl.innerHTML = '<div class="loading">Failed to load: ' + (e.message||'unknown error') + '</div>';
  }
}

function buildCard(metric, thisMonth, ytd, byMonth, qty){
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML =
    '<div class="card-label">' + metric.icon + ' ' + metric.label + '</div>' +
    '<div class="card-row">' +
      '<div class="card-col"><div class="k">This month</div><div class="v">' + fmt$(thisMonth) + '</div>' +
        (qty ? '<div class="q">' + qty.month + '</div>' : '') + '</div>' +
      '<div class="card-col ytd"><div class="k">Year to date</div><div class="v">' + fmt$(ytd) + '</div>' +
        (qty ? '<div class="q">' + qty.ytd + '</div>' : '') + '</div>' +
    '</div>' +
    '<div class="chart-box" id="chart-' + metric.key + '"><canvas id="canvas-' + metric.key + '"></canvas></div>';
  card.addEventListener('click', () => toggleChart(metric.key, byMonth));
  return card;
}

function toggleChart(key, byMonth){
  const box = document.getElementById('chart-' + key);
  const isOpen = box.classList.contains('open');
  document.querySelectorAll('.chart-box.open').forEach(b => b.classList.remove('open'));
  if (isOpen) return;
  box.classList.add('open');
  if (charts[key]) { charts[key].destroy(); }
  const keys = last12Keys();
  const labels = keys.map(k => MONTH_NAMES[parseInt(k.slice(5,7),10)-1]);
  const data = keys.map(k => Math.round(amt(byMonth[k])));

  // 3-month trailing moving average. First two points have no prior data
  // within this 12-month window, so they're left as gaps rather than a
  // misleadingly short average.
  const movingAvg = data.map((_, i) => i < 2 ? null : Math.round((data[i] + data[i-1] + data[i-2]) / 3));

  // Chart.js draws datasets lowest-order-first (i.e. lowest order ends up at
  // the back), so lines need a HIGHER order than the bars to render on top.
  const datasets = [{
    label: 'Actual',
    data,
    backgroundColor: '#c07a1a',
    borderRadius: 3,
    order: 1
  }, {
    type: 'line',
    label: '3-mo avg',
    data: movingAvg,
    borderColor: '#3b6fa0',
    borderWidth: 2,
    pointRadius: 0,
    fill: false,
    spanGaps: false,
    order: 3
  }];

  const TARGET = 165000;
  if (key === 'bookings' || key === 'sales') {
    datasets.push({
      type: 'line',
      label: 'Target',
      data: keys.map(() => TARGET),
      borderColor: '#2e9e62',
      borderWidth: 2,
      borderDash: [6,4],
      pointRadius: 0,
      fill: false,
      order: 2
    });
  }

  const ctx = document.getElementById('canvas-' + key).getContext('2d');
  charts[key] = new Chart(ctx, {
    type:'bar',
    data:{ labels, datasets },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label: c => (c.dataset.label||'') + ': ' + fmt$(c.parsed.y) } } },
      scales:{
        x:{ ticks:{ color:'#6b6b78', font:{size:10} }, grid:{ display:false } },
        y:{ ticks:{ color:'#6b6b78', font:{size:10}, callback: v => (v>=1000?('$'+(v/1000)+'k'):('$'+v)) }, grid:{ color:'#e8e8ed' } }
      }
    }
  });
}

// ---- AUTH ----
async function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPassword').value;
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('loginError');
  err.textContent = '';
  if (!email || !pass) { err.textContent = 'Enter email and password'; return; }
  btn.disabled = true; btn.textContent = 'Signing in…';
  const { error } = await sb.auth.signInWithPassword({ email, password: pass });
  btn.disabled = false; btn.textContent = 'Sign in';
  if (error) { err.textContent = 'Invalid email or password'; return; }
  showApp();
}

function showApp(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  loadAllMetrics();
}

function showLogin(){
  document.getElementById('app').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
}

(async function start(){
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: {
      storage: window.nulabsSessionStorage || window.localStorage,
      autoRefreshToken: true,
      persistSession: true,
      detectSessionInUrl: false
    }
  });

  sb.auth.onAuthStateChange((event) => {
    if (event === 'SIGNED_OUT') showLogin();
  });

  let { data: { session } } = await sb.auth.getSession();
  if (session && session.expires_at) {
    const msLeft = (session.expires_at * 1000) - Date.now();
    if (msLeft < 60000) {
      const { data: refreshed, error } = await sb.auth.refreshSession();
      if (error) { showLogin(); return; }
      session = refreshed.session;
    }
  }

  if (session && session.user) {
    showApp();
  } else {
    showLogin();
  }
})();
</script>
</body>
